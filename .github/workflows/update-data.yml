name: Update Regional Map Data

on:
  schedule:
    # Runs every Monday at 03:00 UTC (7:00 AM UAE Time / GST)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node fetch-region.js

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add region-map-data.json
          # [skip ci] strictly instructs Netlify NOT to trigger a build
          git commit -m "chore: auto-update map data [skip ci]" || exit 0
          git push
