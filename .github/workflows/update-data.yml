name: Update Regional Data

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 03:00 UTC
  workflow_dispatch:

# Prevents multiple workflow runs from executing at the exact same time
concurrency:
  group: update-regional-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Map Fetch Script
        run: node fetch-region.js

      - name: Run Stats & Audit Script
        run: node fetch-stats.js

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage both data files
          git add region-map-data.json region-stats-data.json
          
          # Only attempt to commit and push if either JSON file actually changed
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-update regional map & stats data [skip ci]"
            
            # Fetch the absolute latest remote state right before pushing
            git fetch origin main
            # Rebase our new commit cleanly on top of remote
            git pull origin main --rebase --autostash
            # Push the changes
            git push origin main
          else
            echo "No changes to map or stats data detected. Skipping commit."
          fi
