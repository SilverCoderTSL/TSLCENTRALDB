name: Update Regional Map Data

on:
  schedule:
    # Runs every Monday at 03:00 UTC (7:00 AM UAE Time / GST)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Force checkout onto real 'main' branch, not detached HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node fetch-region.js

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update map data [skip ci]"
          file_pattern: "region-map-data.json"
